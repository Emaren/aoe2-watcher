name: Sign Windows Watcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".sign-windows-trigger"

permissions:
  contents: read

jobs:
  sign-windows:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Lint runtime JavaScript
        shell: pwsh
        run: npm run lint

      - name: Run Watcher contracts
        shell: pwsh
        run: npm test

      - name: Build Windows watcher EXEs on Windows
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item dist -Recurse -Force
          }

          npm run dist:win

      - name: Stage candidate EXEs for signing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null

          $targets = Get-ChildItem "dist" -File -Filter "*.exe" |
            Where-Object {
              $_.Name -like "*Setup*.exe" -or
              $_.Name -like "*Watcher*.exe"
            }

          if (-not $targets -or $targets.Count -eq 0) {
            throw "No top-level Windows watcher EXEs found in dist/"
          }

          foreach ($file in $targets) {
            Write-Host "Staging $($file.FullName)"
            Copy-Item $file.FullName -Destination "build\$($file.Name)" -Force
          }

          Write-Host "Candidate EXEs staged for signing:"
          Get-ChildItem -File "build" -Filter "*.exe" |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

      - name: Upload unsigned Windows candidates for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-candidates
          path: build/*.exe
          if-no-files-found: error

      - name: Sign Windows EXEs with Azure Artifact Signing
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: aoe2hdbetssigning
          certificate-profile-name: aoe2warwindows
          files-folder: ${{ github.workspace }}\build
          files-folder-filter: exe
          files-folder-recurse: true
          batch-size: 1
          timeout: 300
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: AoE2HDBets Watcher
          description-url: https://aoe2war.com

      - name: Verify signed and timestamped Windows release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (node -p "require('./package.json').version").Trim()
          $expectedNames = @(
            "AoE2HDBets Watcher Setup $version.exe",
            "AoE2HDBets Watcher $version.exe"
          )
          $files = @(Get-ChildItem -Path "build" -Filter "*.exe" -File)
          if ($files.Count -ne $expectedNames.Count) {
            throw "Expected exactly two signed Windows binaries; got $($files.Count)"
          }
          $actualNames = @($files | ForEach-Object { $_.Name } | Sort-Object)
          $wantedNames = @($expectedNames | Sort-Object)
          if (($actualNames -join "|") -cne ($wantedNames -join "|")) {
            throw "Signed Windows artifact filenames or version do not match package authority"
          }
          $rows = @()
          foreach ($file in $files) {
            if ($file.Length -lt 1000000) {
              throw "Signed Windows binary is unexpectedly small: $($file.Name)"
            }
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid Authenticode signature on $($file.Name): $($signature.Status)"
            }
            if ($null -eq $signature.SignerCertificate) {
              throw "Missing signing certificate on $($file.Name)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Missing verified RFC3161 timestamp on $($file.Name)"
            }
            $digest = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $rows += "$digest  $($file.Name)"
            Write-Host "SIGNED/TIMESTAMPED $($file.Name): sha256=$digest"
          }
          $rows | Set-Content -Path "build/SIGNED_WINDOWS_SHA256.txt" -Encoding utf8

      - name: Upload signed EXEs
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-watcher
          path: |
            build/**/*.exe
            build/SIGNED_WINDOWS_SHA256.txt
