name: Sign Windows Watcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-windows:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Build Windows watcher EXEs on Windows
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item dist -Recurse -Force
          }

          npm run dist:win

      - name: Stage candidate EXEs for signing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null

          $targets = Get-ChildItem "dist" -File -Filter "*.exe" |
            Where-Object {
              $_.Name -like "*Setup*.exe" -or
              $_.Name -like "*Watcher*.exe"
            }

          if (-not $targets -or $targets.Count -eq 0) {
            throw "No top-level Windows watcher EXEs found in dist/"
          }

          foreach ($file in $targets) {
            Write-Host "Staging $($file.FullName)"
            Copy-Item $file.FullName -Destination "build\$($file.Name)" -Force
          }

          Write-Host "Candidate EXEs staged for signing:"
          Get-ChildItem -File "build" -Filter "*.exe" |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

      - name: Sign Windows EXEs with Azure Artifact Signing
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: aoe2hdbetssigning
          certificate-profile-name: aoe2hdbetswindows
          files-folder: ${{ github.workspace }}\build
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: AoE2HDBets Watcher
          description-url: https://aoe2hdbets.com

      - name: Upload signed EXEs
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-watcher
          path: |
            build/**/*.exe
