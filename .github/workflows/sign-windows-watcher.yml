name: Sign Windows Watcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-windows:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show candidate EXEs before download
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File -Filter *.exe |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

      - name: Download live Windows watcher EXEs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null

          $files = @(
            @{
              Url = "https://aoe2hdbets.com/downloads/AoE2HDBets%20Watcher%20Setup%201.1.0.exe"
              Out = "build\\AoE2HDBets Watcher Setup 1.1.0.exe"
            },
            @{
              Url = "https://aoe2hdbets.com/downloads/AoE2HDBets%20Watcher%201.1.0.exe"
              Out = "build\\AoE2HDBets Watcher 1.1.0.exe"
            }
          )

          foreach ($f in $files) {
            Write-Host "Downloading $($f.Url)"
            Invoke-WebRequest -Uri $f.Url -OutFile $f.Out
          }

          Get-ChildItem -Recurse -File -Filter *.exe |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

      - name: Sign Windows EXEs with Azure Artifact Signing
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: aoe2hdbetssigning
          certificate-profile-name: aoe2hdbetswindows
          files-folder: ${{ github.workspace }}\build
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: AoE2HDBets Watcher
          description-url: https://aoe2hdbets.com

      - name: Upload signed EXEs
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-watcher
          path: |
            build/**/*.exe
