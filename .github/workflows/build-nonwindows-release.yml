name: Build non-Windows Watcher Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".build-nonwindows-trigger"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Lint runtime JavaScript
        run: npm run lint

      - name: Run Watcher contracts
        run: npm test

      # Owner policy: use unsigned macOS manual builds until project revenue supports Apple Developer.
      - name: Build unsigned macOS DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          APPLE_ID: ""
          APPLE_APP_SPECIFIC_PASSWORD: ""
          APPLE_TEAM_ID: ""
        run: |
          set -euo pipefail
          rm -rf dist
          npm run dist:mac -- --config.mac.identity=-
          npm run dist:manual-zip
          npm run verify:mac-updater
          python3 scripts/audit_mac_updater_zip.py "dist/AoE2HDBets Watcher-${{ steps.package.outputs.version }}-arm64-mac.zip" --version "${{ steps.package.outputs.version }}"
          node scripts/smoke-mac-signed-release.cjs "dist/AoE2HDBets Watcher-${{ steps.package.outputs.version }}-arm64-mac.zip" "${{ steps.package.outputs.version }}" "$GITHUB_SHA"
          stage="$(mktemp -d "${RUNNER_TEMP}/watcher-mac-bundle-audit.XXXXXX")"
          chmod 700 "$stage"
          trap 'rm -rf "$stage"' EXIT
          ditto -x -k "dist/AoE2HDBets Watcher-${{ steps.package.outputs.version }}-arm64-mac.zip" "$stage"
          node scripts/verify-extracted-mac-bundle.cjs "$stage/AoE2HDBets Watcher.app" "${{ steps.package.outputs.version }}" arm64

      - name: Verify sealed unsigned Mac app and all actual distribution forms
        shell: bash
        run: |
          set -euo pipefail
          app="dist/mac-arm64/AoE2HDBets Watcher.app"
          bash scripts/verify-mac-adhoc-seal.sh "$app"
          version="$(node -p "require('./package.json').version")"
          stage="$(mktemp -d "${RUNNER_TEMP}/watcher-mac-distribution-seal.XXXXXX")"
          chmod 700 "$stage"
          mount="$stage/mount"
          attached=0
          cleanup() {
            if [ "$attached" -eq 1 ]; then hdiutil detach -quiet "$mount" || true; fi
            rm -rf "$stage"
          }
          trap cleanup EXIT
          mkdir -p "$stage/native" "$stage/direct" "$mount"
          ditto -x -k "dist/AoE2HDBets Watcher-${version}-arm64-mac.zip" "$stage/native"
          ditto -x -k "dist/aoe2hdbets-watcher-direct.zip" "$stage/direct"
          bash scripts/verify-mac-adhoc-seal.sh "$stage/native/AoE2HDBets Watcher.app"
          bash scripts/verify-mac-adhoc-seal.sh "$stage/direct/AoE2HDBets Watcher Direct/AoE2HDBets Watcher.app"
          hdiutil attach -quiet -readonly -nobrowse -noautoopen -mountpoint "$mount" "dist/AoE2HDBets Watcher-${version}-arm64.dmg"
          attached=1
          bash scripts/verify-mac-adhoc-seal.sh "$mount/AoE2HDBets Watcher.app"
          for file in "Contents/MacOS/AoE2HDBets Watcher" "Contents/Resources/app.asar" "Contents/_CodeSignature/CodeResources"; do
            cmp -s "$app/$file" "$stage/native/AoE2HDBets Watcher.app/$file" || { echo "STOP: native ZIP payload differs" >&2; exit 6; }
            cmp -s "$app/$file" "$stage/direct/AoE2HDBets Watcher Direct/AoE2HDBets Watcher.app/$file" || { echo "STOP: direct ZIP payload differs" >&2; exit 6; }
            cmp -s "$app/$file" "$mount/AoE2HDBets Watcher.app/$file" || { echo "STOP: DMG payload differs" >&2; exit 6; }
          done
          echo "MAC_UNSIGNED_DMG_ZIP_SEAL_AND_PAYLOAD_PARITY_PASS"
      - name: Verify and attest unsigned macOS manual release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          dmg="dist/AoE2HDBets Watcher-${version}-arm64.dmg"
          app="dist/mac-arm64/AoE2HDBets Watcher.app"
          test -s "$dmg"
          test -d "$app"
          test -s dist/aoe2hdbets-watcher-direct.zip
          test -s dist/latest-mac.yml
          npm run verify:mac-updater
          if codesign -dv --verbose=2 "$app" 2>&1 | grep -q 'Authority=Developer ID Application:'; then
            echo "STOP: unsigned lane unexpectedly produced a Developer ID binary" >&2
            exit 1
          fi
          shasum -a 256 "$dmg" dist/aoe2hdbets-watcher-direct.zip dist/*-arm64*.zip dist/latest-mac.yml > dist/UNSIGNED_MACOS_SHA256.txt
          cat dist/UNSIGNED_MACOS_SHA256.txt
          echo "UNSIGNED_MACOS_MANUAL_ONLY=1 — no notarization or automatic installation."

      - name: Upload macOS release
        uses: actions/upload-artifact@v4
        with:
          name: watcher-macos-${{ steps.package.outputs.version }}
          if-no-files-found: error
          path: |
            dist/AoE2HDBets Watcher-${{ steps.package.outputs.version }}-arm64.dmg
            dist/AoE2HDBets Watcher-${{ steps.package.outputs.version }}-arm64.dmg.blockmap
            dist/aoe2hdbets-watcher-direct.zip
            dist/*-arm64*.zip
            dist/latest-mac.yml
            dist/UNSIGNED_MACOS_SHA256.txt

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Lint runtime JavaScript
        run: npm run lint

      - name: Run Watcher contracts
        run: npm test

      - name: Build Linux Watcher
        run: |
          rm -rf dist
          npm run dist:linux

      - name: Upload Linux release
        uses: actions/upload-artifact@v4
        with:
          name: watcher-linux-${{ steps.package.outputs.version }}
          if-no-files-found: error
          path: |
            dist/AoE2HDBets Watcher-${{ steps.package.outputs.version }}.AppImage
            dist/latest-linux.yml
