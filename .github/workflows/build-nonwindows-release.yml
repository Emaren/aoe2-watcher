name: Build non-Windows Watcher Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".build-nonwindows-trigger"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Lint runtime JavaScript
        run: npm run lint

      - name: Run Watcher contracts
        run: npm test

      - name: Build macOS Watcher
        run: |
          rm -rf dist
          npm run dist:mac
          npm run dist:manual-zip

      - name: Upload macOS release
        uses: actions/upload-artifact@v4
        with:
          name: watcher-macos-${{ steps.package.outputs.version }}
          if-no-files-found: error
          path: |
            dist/AoE2HDBets Watcher-${{ steps.package.outputs.version }}-arm64.dmg
            dist/AoE2HDBets Watcher-${{ steps.package.outputs.version }}-arm64.dmg.blockmap
            dist/aoe2hdbets-watcher-direct.zip
            dist/latest-mac.yml

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Lint runtime JavaScript
        run: npm run lint

      - name: Run Watcher contracts
        run: npm test

      - name: Build Linux Watcher
        run: |
          rm -rf dist
          npm run dist:linux

      - name: Upload Linux release
        uses: actions/upload-artifact@v4
        with:
          name: watcher-linux-${{ steps.package.outputs.version }}
          if-no-files-found: error
          path: |
            dist/AoE2HDBets Watcher-${{ steps.package.outputs.version }}.AppImage
            dist/latest-linux.yml
