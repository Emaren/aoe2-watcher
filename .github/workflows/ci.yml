name: Watcher CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # DocsV2 verifies a real implementation ancestor and source-only
          # changes since it; the default depth=1 cannot establish either.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # DocsV2 is a release gate, not optional reference material. The
      # generated registry must classify every Markdown source and bind the
      # reviewed implementation SHA without modifying source on CI.
      - name: Verify source-bound DocsV2 registry and index
        run: python3 scripts/docs_v2_check.py

      - name: Lint runtime JavaScript
        run: npm run lint

      - name: Run Watcher contracts
        run: npm test

      - name: Prove native Mac ZIP auditor rejects unsafe entries
        run: python3 -m unittest discover -s tests -p 'test_mac_zip_audit.py'

      - name: Package smoke test
        run: npm run pack
      - name: Audit actual Linux-unpacked Electron runtime ASAR
        run: node scripts/audit-packaged-runtime.cjs "$PWD/dist/linux-unpacked/resources/app.asar"
      - name: Smoke actual packaged Linux Electron main process and dashboard
        shell: bash
        run: bash scripts/smoke-linux-electron-boot.sh

      # Run last so an external advisory does not hide local test failures.
      # This remains a required hard-failing security gate; do not bypass it.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Dev build-chain advisories are reviewed separately. Runtime modules
      # must meet the stricter moderate-severity policy, without exemptions.
      - name: Audit production dependencies at moderate severity
        run: npm audit --omit=dev --audit-level=moderate

  windows-video-package:
    name: Windows NSIS and portable packaging smoke
    runs-on: windows-latest
    timeout-minutes: 30
    # No release, signing secret, GitHub release, or deployment permission.
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout Watcher candidate
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install exact dependencies
        run: npm ci
      - name: Verify Windows JavaScript and video contracts
        run: |
          npm run lint
          npm test
      - name: Build both unsigned Windows candidates without publishing
        run: npm run dist:win -- --publish never
      - name: Audit actual Windows Electron runtime ASAR
        shell: pwsh
        run: |
          $asar = (Resolve-Path "dist/win-unpacked/resources/app.asar").Path
          node scripts/audit-packaged-runtime.cjs $asar
      - name: Verify NSIS and portable executable outputs
        shell: pwsh
        run: |
          $binaries = @(Get-ChildItem -Path dist -Filter "*.exe" -File)
          $installers = @($binaries | Where-Object { $_.Name -match "Setup" })
          $portables = @($binaries | Where-Object { $_.Name -notmatch "Setup" })
          if ($installers.Count -lt 1 -or $portables.Count -lt 1) {
            throw "Both NSIS Setup and separate portable Windows .exe artifacts must exist."
          }
          foreach ($binary in $binaries) {
            if ($binary.Length -lt 1000000) {
              throw "Windows candidate unexpectedly small: $($binary.Name)"
            }
            Get-FileHash -Algorithm SHA256 -Path $binary.FullName |
              Select-Object Algorithm, Hash, Path | Format-Table -AutoSize
          }
          $version = (node -p "require('./package.json').version").Trim()
          if ($version -ne "1.6.5") { throw "Wrong candidate version: $version" }
          if (@($binaries | Where-Object { -not $_.Name.Contains($version) }).Count) {
            throw "Candidate filename and version disagree."
          }
          if (-not (Test-Path "dist/latest.yml")) { throw "Updater latest.yml is missing." }
          if (-not (Select-String -Path "dist/latest.yml" -SimpleMatch -Pattern "version: $version" -Quiet)) {
            throw "Updater latest.yml version mismatch."
          }
          $binaries | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Path "dist/WINDOWS_TEST_ONLY_SHA256.txt" -Encoding utf8
          Write-Output "Windows 1.6.5 package smoke passed. Still unsigned and unreleased."
      - name: Preserve restricted 1.6.5 Windows test artifacts for two days
        uses: actions/upload-artifact@v4
        with:
          name: watcher-1.6.5-windows-unsigned-test-only
          path: |
            dist/*.exe
            dist/latest.yml
            dist/WINDOWS_TEST_ONLY_SHA256.txt
          if-no-files-found: error
          retention-days: 2

  macos-video-package:
    name: macOS arm64 DMG and direct ZIP packaging smoke
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout Watcher candidate
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install exact dependencies
        run: npm ci
      - name: Verify macOS source and update contracts
        run: |
          npm run lint
          npm test
      - name: Build unsigned macOS arm64 DMG without publishing
        run: npm run dist:mac -- --publish never
      - name: Build direct ZIP from exact same macOS app bundle
        run: npm run dist:manual-zip
      - name: Audit actual macOS Electron runtime ASAR
        run: node scripts/audit-packaged-runtime.cjs "$PWD/dist/mac-arm64/AoE2HDBets Watcher.app/Contents/Resources/app.asar"
      - name: Verify updater-native macOS ZIP and manifest integrity
        run: npm run verify:mac-updater
      - name: Audit actual updater-native ZIP filesystem safety
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          python3 scripts/audit_mac_updater_zip.py "dist/AoE2HDBets Watcher-${version}-arm64-mac.zip" --version "$version"
          node scripts/smoke-mac-signed-release.cjs "dist/AoE2HDBets Watcher-${version}-arm64-mac.zip" "$version" "$GITHUB_SHA"
      - name: Validate real native updater ZIP after isolated macOS extraction
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d "${RUNNER_TEMP}/watcher-mac-bundle-audit.XXXXXX")"
          chmod 700 "$stage"
          trap 'rm -rf "$stage"' EXIT
          version="$(node -p "require('./package.json').version")"
          ditto -x -k "dist/AoE2HDBets Watcher-${version}-arm64-mac.zip" "$stage"
          node scripts/verify-extracted-mac-bundle.cjs "$stage/AoE2HDBets Watcher.app" "$version" arm64
      - name: Check DMG/ZIP artifacts, safe readme and content hashes
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$version" = "1.6.5"
          shopt -s nullglob
          dmg_files=(dist/*"$version"*arm64.dmg)
          zip_files=(dist/aoe2hdbets-watcher-direct.zip)
          test "${#dmg_files[@]}" -eq 1
          test "${#zip_files[@]}" -eq 1
          test -s "${dmg_files[0]}"
          test -s "${zip_files[0]}"
          test -d "dist/mac-arm64/AoE2HDBets Watcher.app"
          if unzip -p "${zip_files[0]}" "AoE2HDBets Watcher Direct/README.txt" | grep -Eq 'xattr -dr|spctl --master-disable|If macOS blocks the unsigned app'; then
            echo "Unsafe macOS installation instruction found" >&2
            exit 1
          fi
          unzip -p "${zip_files[0]}" "AoE2HDBets Watcher Direct/README.txt" | grep -Fq "intentionally UNSIGNED and is not Apple notarized"
          shasum -a 256 "${dmg_files[@]}" "${zip_files[@]}" dist/*"$version"*arm64*.zip | tee dist/MACOS_TEST_ONLY_SHA256.txt
      - name: Preserve two-day unsigned macOS test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watcher-1.6.5-macos-unsigned-test-only
          path: |
            dist/*.dmg
            dist/aoe2hdbets-watcher-direct.zip
            dist/*-arm64*.zip
            dist/latest-mac.yml
            dist/MACOS_TEST_ONLY_SHA256.txt
          if-no-files-found: error
          retention-days: 2

  linux-appimage-package:
    name: Linux x64 AppImage packaging smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Watcher candidate
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install exact dependencies
        run: npm ci
      - name: Build AppImage without publishing
        run: npm run dist:linux -- --publish never
      - name: Audit actual AppImage source Electron ASAR
        run: node scripts/audit-packaged-runtime.cjs "$PWD/dist/linux-unpacked/resources/app.asar"
      - name: Verify versioned AppImage and its integrity
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$version" = "1.6.5"
          shopt -s nullglob
          images=(dist/*"$version"*.AppImage)
          test "${#images[@]}" -eq 1
          test -s "${images[0]}"
          test "$(stat -c %s "${images[0]}")" -gt 1000000
          sha256sum "${images[@]}" | tee dist/LINUX_TEST_ONLY_SHA256.txt
      - name: Preserve two-day unsigned Linux test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watcher-1.6.5-linux-unsigned-test-only
          path: |
            dist/*.AppImage
            dist/LINUX_TEST_ONLY_SHA256.txt
          if-no-files-found: error
          retention-days: 2
 || true
          )
          if [ "${#executables[@]}" -ne 1 ]; then
            echo "STOP: expected exactly one packaged Watcher binary; found ${#executables[@]}" >&2
            exit 1
          fi

          pid=""
          cleanup() {
            if [ -n "$pid" ]; then
              kill -TERM -- "-$pid" 2>/dev/null || true
              sleep 1
              kill -KILL -- "-$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -rf "$stage"
          }
          trap cleanup EXIT

          # Isolated, credential-free test profile. Every network destination is
          # loopback; no replay folder from a real player is accessible.
          setsid env \
            HOME="$stage/home" \
            XDG_CONFIG_HOME="$stage/home/.config" \
            XDG_DATA_HOME="$stage/home/.local/share" \
            AOE2_UPLOAD_API_KEY="" \
            AOE2_WATCH_DIR="$stage/empty-replays" \
            AOE2_TELEMETRY_HEARTBEAT_MS=0 \
            AOE2_API_BASE_URL="http://127.0.0.1:9" \
            AOE2_API_FALLBACK_BASE_URL="http://127.0.0.1:9" \
            AOE2_TELEMETRY_BASE_URL="http://127.0.0.1:9" \
            AOE2_UPDATE_FEED_URL="http://127.0.0.1:9/downloads" \
            xvfb-run -a -s "-screen 0 1280x960x24" \
            "${executables[0]}" --no-sandbox --disable-gpu --disable-dev-shm-usage \
            > "$stage/boot.log" 2>&1 &
          pid=$!

          ready=0
          for _ in $(seq 1 35); do
            if grep -Fq 'Runtime initialized:' "$stage/boot.log" &&
               grep -Fq 'Dashboard renderer ready' "$stage/boot.log"; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "STOP: packaged Electron exited before renderer readiness" >&2
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "STOP: real packaged Electron/renderer did not reach both boot receipts" >&2
            tail -n 100 "$stage/boot.log" >&2
            exit 1
          fi
          echo "PACKAGED_LINUX_ELECTRON_MAIN_AND_RENDERER_BOOT_PASS"

      # Run last so an external advisory does not hide local test failures.
      # This remains a required hard-failing security gate; do not bypass it.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Dev build-chain advisories are reviewed separately. Runtime modules
      # must meet the stricter moderate-severity policy, without exemptions.
      - name: Audit production dependencies at moderate severity
        run: npm audit --omit=dev --audit-level=moderate

