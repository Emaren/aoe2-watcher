name: Watcher CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint runtime JavaScript
        run: npm run lint

      - name: Run Watcher contracts
        run: npm test

      - name: Package smoke test
        run: npm run pack

      # Run last so an external advisory does not hide local test failures.
      # This remains a required hard-failing security gate; do not bypass it.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  windows-video-package:
    name: Windows NSIS and portable packaging smoke
    runs-on: windows-latest
    timeout-minutes: 30
    # No release, signing secret, GitHub release, or deployment permission.
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout Watcher candidate
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install exact dependencies
        run: npm ci
      - name: Verify Windows JavaScript and video contracts
        run: |
          npm run lint
          npm test
      - name: Build both unsigned Windows candidates without publishing
        run: npm run dist:win -- --publish never
      - name: Verify NSIS and portable executable outputs
        shell: pwsh
        run: |
          $binaries = @(Get-ChildItem -Path dist -Filter "*.exe" -File)
          $installers = @($binaries | Where-Object { $_.Name -match "Setup" })
          $portables = @($binaries | Where-Object { $_.Name -notmatch "Setup" })
          if ($installers.Count -lt 1 -or $portables.Count -lt 1) {
            throw "Both NSIS Setup and separate portable Windows .exe artifacts must exist."
          }
          foreach ($binary in $binaries) {
            if ($binary.Length -lt 1000000) {
              throw "Windows candidate unexpectedly small: $($binary.Name)"
            }
            Get-FileHash -Algorithm SHA256 -Path $binary.FullName |
              Select-Object Algorithm, Hash, Path | Format-Table -AutoSize
          }
          $version = (node -p "require('./package.json').version").Trim()
          if ($version -ne "1.6.4") { throw "Wrong candidate version: $version" }
          if (@($binaries | Where-Object { -not $_.Name.Contains($version) }).Count) {
            throw "Candidate filename and version disagree."
          }
          if (-not (Test-Path "dist/latest.yml")) { throw "Updater latest.yml is missing." }
          if (-not (Select-String -Path "dist/latest.yml" -SimpleMatch -Pattern "version: $version" -Quiet)) {
            throw "Updater latest.yml version mismatch."
          }
          $binaries | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Path "dist/WINDOWS_TEST_ONLY_SHA256.txt" -Encoding utf8
          Write-Output "Windows 1.6.4 package smoke passed. Still unsigned and unreleased."
      - name: Preserve restricted 1.6.4 Windows test artifacts for two days
        uses: actions/upload-artifact@v4
        with:
          name: watcher-1.6.4-windows-unsigned-test-only
          path: |
            dist/*.exe
            dist/latest.yml
            dist/WINDOWS_TEST_ONLY_SHA256.txt
          if-no-files-found: error
          retention-days: 2
