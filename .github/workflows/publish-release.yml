name: Publish Watcher Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".publish-release-trigger"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERSION: "1.5.13"
      WINDOWS_RUN_ID: "35552739520"
      NONWINDOWS_RUN_ID: "35552739589"
      RUNTIME_SOURCE_SHA: "79c4641e77df26e488c252738ff6f44e89772de6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download certified platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf staging
          mkdir -p staging/windows staging/macos staging/linux release

          gh run download "$WINDOWS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name signed-windows-watcher \
            --dir staging/windows

          gh run download "$NONWINDOWS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name watcher-macos-1.5.13 \
            --dir staging/macos

          gh run download "$NONWINDOWS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name watcher-linux-1.5.13 \
            --dir staging/linux

          cp staging/windows/*.exe release/
          cp staging/macos/*.dmg release/
          cp staging/macos/*.dmg.blockmap release/
          cp staging/macos/aoe2hdbets-watcher-direct.zip release/
          cp staging/macos/latest-mac.yml release/
          cp staging/linux/*.AppImage release/
          cp staging/linux/latest-linux.yml release/

      - name: Build signed Windows updater manifest and release receipts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import datetime
          import hashlib
          import json
          import os

          root = Path("release")
          version = os.environ["VERSION"]
          installer = root / f"AoE2HDBets Watcher Setup {version}.exe"
          payload = installer.read_bytes()
          sha512 = base64.b64encode(hashlib.sha512(payload).digest()).decode()

          latest = (
              f"version: {version}\n"
              "files:\n"
              f"  - url: AoE2HDBets%20Watcher%20Setup%20{version}.exe\n"
              f"    sha512: {sha512}\n"
              f"    size: {len(payload)}\n"
              f"path: AoE2HDBets Watcher Setup {version}.exe\n"
              f"sha512: {sha512}\n"
              f"releaseDate: '{datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z')}'\n"
          )
          (root / "latest.yml").write_text(latest)

          canonical = [
              f"AoE2HDBets Watcher Setup {version}.exe",
              f"AoE2HDBets Watcher {version}.exe",
              f"AoE2HDBets Watcher-{version}-arm64.dmg",
              "aoe2hdbets-watcher-direct.zip",
              f"AoE2HDBets Watcher-{version}.AppImage",
              f"AoE2HDBets Watcher-{version}-arm64.dmg.blockmap",
              "latest.yml",
              "latest-mac.yml",
              "latest-linux.yml",
          ]

          rows = []
          for name in canonical:
              path = root / name
              data = path.read_bytes()
              rows.append({
                  "filename": name,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })

          (root / f"SHA256SUMS-{version}.txt").write_text(
              "".join(f"{row['sha256']}  {row['filename']}\n" for row in rows)
          )

          manifest = {
              "schema": 1,
              "release": f"AoE2HDBets Watcher {version}",
              "version": version,
              "runtime_source_sha": os.environ["RUNTIME_SOURCE_SHA"],
              "windows_signing_run_id": int(os.environ["WINDOWS_RUN_ID"]),
              "nonwindows_build_run_id": int(os.environ["NONWINDOWS_RUN_ID"]),
              "files": rows,
          }
          (root / f"watcher-release-manifest-{version}.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )

          expected = {
              f"AoE2HDBets Watcher Setup {version}.exe": "73a432687fd3b1989ff4cb5063d9e29589b6471186e277df399b6bb5599a91ec",
              f"AoE2HDBets Watcher {version}.exe": "4583ce46bebd864a32b2db4d0b57792b6e70d31dfd9c56a414644c857e674248",
              f"AoE2HDBets Watcher-{version}-arm64.dmg": "87c9545364bab48ee0e45cb7cb3e145a953a52ea480481ba427f0b55cdd4e140",
              "aoe2hdbets-watcher-direct.zip": "80eea06fc3beec7c905379d59180a04e2cf36303f9712f07397403700a81c142",
              f"AoE2HDBets Watcher-{version}.AppImage": "823b6a29836dea8caf2953201e68681adbdc4d3855b1b25a5c19bff8d618770e",
          }

          actual = {row["filename"]: row["sha256"] for row in rows}
          for name, digest in expected.items():
              if actual.get(name) != digest:
                  raise SystemExit(
                      f"STOP: certified hash mismatch for {name}: {actual.get(name)} != {digest}"
                  )

          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "STOP: release $TAG already exists" >&2
            exit 2
          fi

          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AoE2HDBets Watcher $VERSION" \
            --notes "Watcher $VERSION restores live replay adoption when native file events are missed, removes English-only filename admission, and keeps known-final replay fingerprint/hash duplicate safety intact. Windows artifacts are Azure-signed and timestamped. Runtime source: $RUNTIME_SOURCE_SHA."

      - name: Verify published release inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,assets
