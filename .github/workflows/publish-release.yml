name: Publish Watcher Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".publish-release-trigger"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERSION: "1.5.11"
      WINDOWS_RUN_ID: "34847268397"
      NONWINDOWS_RUN_ID: "34847268637"
      RUNTIME_SOURCE_SHA: "758804e673f2fd06460cb30919ddb7629c76a555"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download certified platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf staging
          mkdir -p staging/windows staging/macos staging/linux release

          gh run download "$WINDOWS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name signed-windows-watcher \
            --dir staging/windows

          gh run download "$NONWINDOWS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name watcher-macos-1.5.11 \
            --dir staging/macos

          gh run download "$NONWINDOWS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name watcher-linux-1.5.11 \
            --dir staging/linux

          cp staging/windows/*.exe release/
          cp staging/macos/*.dmg release/
          cp staging/macos/*.dmg.blockmap release/
          cp staging/macos/aoe2hdbets-watcher-direct.zip release/
          cp staging/macos/latest-mac.yml release/
          cp staging/linux/*.AppImage release/
          cp staging/linux/latest-linux.yml release/

      - name: Build signed Windows updater manifest and release receipts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import datetime
          import hashlib
          import json
          import os

          root = Path("release")
          version = os.environ["VERSION"]
          installer = root / f"AoE2HDBets Watcher Setup {version}.exe"
          payload = installer.read_bytes()
          sha512 = base64.b64encode(hashlib.sha512(payload).digest()).decode()

          latest = (
              f"version: {version}\n"
              "files:\n"
              f"  - url: AoE2HDBets%20Watcher%20Setup%20{version}.exe\n"
              f"    sha512: {sha512}\n"
              f"    size: {len(payload)}\n"
              f"path: AoE2HDBets Watcher Setup {version}.exe\n"
              f"sha512: {sha512}\n"
              f"releaseDate: '{datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z')}'\n"
          )
          (root / "latest.yml").write_text(latest)

          canonical = [
              f"AoE2HDBets Watcher Setup {version}.exe",
              f"AoE2HDBets Watcher {version}.exe",
              f"AoE2HDBets Watcher-{version}-arm64.dmg",
              "aoe2hdbets-watcher-direct.zip",
              f"AoE2HDBets Watcher-{version}.AppImage",
              f"AoE2HDBets Watcher-{version}-arm64.dmg.blockmap",
              "latest.yml",
              "latest-mac.yml",
              "latest-linux.yml",
          ]

          rows = []
          for name in canonical:
              path = root / name
              data = path.read_bytes()
              rows.append({
                  "filename": name,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })

          (root / f"SHA256SUMS-{version}.txt").write_text(
              "".join(f"{row['sha256']}  {row['filename']}\n" for row in rows)
          )

          manifest = {
              "schema": 1,
              "release": f"AoE2HDBets Watcher {version}",
              "version": version,
              "runtime_source_sha": os.environ["RUNTIME_SOURCE_SHA"],
              "windows_signing_run_id": int(os.environ["WINDOWS_RUN_ID"]),
              "nonwindows_build_run_id": int(os.environ["NONWINDOWS_RUN_ID"]),
              "files": rows,
          }
          (root / f"watcher-release-manifest-{version}.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )

          expected = {
              f"AoE2HDBets Watcher Setup {version}.exe": "be936b480aca200d4cfdc8db1475715ff640e161771be85017828fdfcec2fcf5",
              f"AoE2HDBets Watcher {version}.exe": "25301abbc260ecb746a36f8e6466bdcc75840243a6b91bcf2a81558c8f4efda5",
              f"AoE2HDBets Watcher-{version}-arm64.dmg": "300b270298534b7753e2533fd114e445075dc750a309ef430f716e2982c249cb",
              "aoe2hdbets-watcher-direct.zip": "4d0530304ed4fa8c4b5dca1837f22fd0ed06901269325569f99aead598706985",
              f"AoE2HDBets Watcher-{version}.AppImage": "0e01f821fcfeafa2c7bbff654b1ba22260ac9c47c3878b776c5cd0d9f0d1e715",
          }

          actual = {row["filename"]: row["sha256"] for row in rows}
          for name, digest in expected.items():
              if actual.get(name) != digest:
                  raise SystemExit(
                      f"STOP: certified hash mismatch for {name}: {actual.get(name)} != {digest}"
                  )

          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "STOP: release $TAG already exists" >&2
            exit 2
          fi

          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AoE2HDBets Watcher $VERSION" \
            --notes "Watcher $VERSION adds capability-negotiated server media shedding so optional watcher-native video yields cleanly to replay live/final transport while older clients remain backward-safe. Windows artifacts are Azure-signed and timestamped. Runtime source: $RUNTIME_SOURCE_SHA."

      - name: Verify published release inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,assets
