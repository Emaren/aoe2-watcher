name: Publish Watcher Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".publish-release-trigger"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERSION: "1.6.2"
      WINDOWS_RUN_ID: "36649412730"
      NONWINDOWS_RUN_ID: "36649412594"
      RUNTIME_SOURCE_SHA: "1d1e9b3ca9f95a89cf47ab582219e4c85b725603"
      BUILD_SOURCE_SHA: "b1e3b1353aa48840bdaa7d8afc353e1afc5bf22d"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify certified workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view "$WINDOWS_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --json name,event,headSha,conclusion > windows-run.json

          gh run view "$NONWINDOWS_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --json name,event,headSha,conclusion > nonwindows-run.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {
              "windows-run.json": {
                  "name": "Sign Windows Watcher",
                  "event": "push",
                  "headSha": os.environ["BUILD_SOURCE_SHA"],
                  "conclusion": "success",
              },
              "nonwindows-run.json": {
                  "name": "Build non-Windows Watcher Release",
                  "event": "push",
                  "headSha": os.environ["BUILD_SOURCE_SHA"],
                  "conclusion": "success",
              },
          }

          for filename, wanted in expected.items():
              actual = json.loads(Path(filename).read_text())
              for key, value in wanted.items():
                  if actual.get(key) != value:
                      raise SystemExit(
                          f"STOP: {filename} {key} mismatch: "
                          f"{actual.get(key)!r} != {value!r}"
                      )
              print(f"certified {filename}: {actual}")
          PY

      - name: Download certified platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf staging
          mkdir -p staging/windows staging/macos staging/linux release

          gh run download "$WINDOWS_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name signed-windows-watcher             --dir staging/windows

          gh run download "$NONWINDOWS_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "watcher-macos-$VERSION"             --dir staging/macos

          gh run download "$NONWINDOWS_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "watcher-linux-$VERSION"             --dir staging/linux

          cp staging/windows/*.exe release/
          cp staging/macos/*.dmg release/
          cp staging/macos/*.dmg.blockmap release/
          cp staging/macos/aoe2hdbets-watcher-direct.zip release/
          cp staging/macos/latest-mac.yml release/
          cp staging/linux/*.AppImage release/
          cp staging/linux/latest-linux.yml release/

      - name: Build updater manifest and immutable release receipts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import datetime
          import hashlib
          import json
          import os

          root = Path("release")
          version = os.environ["VERSION"]
          installer = root / f"AoE2HDBets Watcher Setup {version}.exe"
          payload = installer.read_bytes()
          sha512 = base64.b64encode(hashlib.sha512(payload).digest()).decode()

          latest = (
              f"version: {version}\n"
              "files:\n"
              f"  - url: AoE2HDBets%20Watcher%20Setup%20{version}.exe\n"
              f"    sha512: {sha512}\n"
              f"    size: {len(payload)}\n"
              f"path: AoE2HDBets Watcher Setup {version}.exe\n"
              f"sha512: {sha512}\n"
              f"releaseDate: '{datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z')}'\n"
          )
          (root / "latest.yml").write_text(latest)

          canonical = [
              f"AoE2HDBets Watcher Setup {version}.exe",
              f"AoE2HDBets Watcher {version}.exe",
              f"AoE2HDBets Watcher-{version}-arm64.dmg",
              "aoe2hdbets-watcher-direct.zip",
              f"AoE2HDBets Watcher-{version}.AppImage",
              f"AoE2HDBets Watcher-{version}-arm64.dmg.blockmap",
              "latest.yml",
              "latest-mac.yml",
              "latest-linux.yml",
          ]

          actual_names = sorted(
              path.name for path in root.iterdir() if path.is_file()
          )
          if actual_names != sorted(canonical):
              raise SystemExit(
                  "STOP: release inventory mismatch before receipts: "
                  f"{actual_names!r} != {sorted(canonical)!r}"
              )

          manifest_expectations = {
              "latest-mac.yml": [
                  f"version: {version}",
                  f"path: AoE2HDBets Watcher-{version}-arm64.dmg",
              ],
              "latest-linux.yml": [
                  f"version: {version}",
                  f"path: AoE2HDBets Watcher-{version}.AppImage",
              ],
              "latest.yml": [
                  f"version: {version}",
                  f"path: AoE2HDBets Watcher Setup {version}.exe",
              ],
          }
          for filename, needles in manifest_expectations.items():
              text = (root / filename).read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(
                          f"STOP: updater metadata mismatch in {filename}: "
                          f"missing {needle!r}"
                      )

          rows = []
          for name in canonical:
              path = root / name
              data = path.read_bytes()
              rows.append({
                  "filename": name,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })

          expected = {
              f"AoE2HDBets Watcher Setup {version}.exe":
                  "80c04168949c791cfdc0c67432c2ac4868459219923d8b7c96efc40f24d8d0c3",
              f"AoE2HDBets Watcher {version}.exe":
                  "4b7d0709dae6e9a80ea400bbb88a87a3880b0d5bf99dac11bcdb5e8b6ff129f7",
              f"AoE2HDBets Watcher-{version}-arm64.dmg":
                  "89860bc8d3a95283cb49d9d86f8a8b8b07e0423b3c7f53ddd5ddd003b1c8df95",
              "aoe2hdbets-watcher-direct.zip":
                  "d2bfb053cf78418fa90d1dca20d223f8488c3baa82071d5db515dbbaceb38a78",
              f"AoE2HDBets Watcher-{version}.AppImage":
                  "a73367344321e0e9399192dd47e588adab68770aa1632636ab4f3f3e1743237a",
              f"AoE2HDBets Watcher-{version}-arm64.dmg.blockmap":
                  "c14e65579e54b2417766c5ab816798fb2f87221798b3fee5fd4c788fa3beaf63",
              "latest-mac.yml":
                  "fc75da5949b3fcf12e3b1ac45feb714f1b983094c62a1c6c8b20bf18d25d1b3c",
              "latest-linux.yml":
                  "2138060fbedb23f3d7a090238634fd0cbd8388db674f80de5cd016093bd47b6f",
          }

          actual = {row["filename"]: row["sha256"] for row in rows}
          for name, digest in expected.items():
              if actual.get(name) != digest:
                  raise SystemExit(
                      f"STOP: certified hash mismatch for {name}: "
                      f"{actual.get(name)} != {digest}"
                  )

          (root / f"SHA256SUMS-{version}.txt").write_text(
              "".join(
                  f"{row['sha256']}  {row['filename']}\n"
                  for row in rows
              )
          )

          manifest = {
              "schema": 2,
              "release": f"AoE2HDBets Watcher {version}",
              "version": version,
              "runtime_source_sha": os.environ["RUNTIME_SOURCE_SHA"],
              "build_source_sha": os.environ["BUILD_SOURCE_SHA"],
              "windows_signing_run_id": int(os.environ["WINDOWS_RUN_ID"]),
              "nonwindows_build_run_id": int(
                  os.environ["NONWINDOWS_RUN_ID"]
              ),
              "files": rows,
          }
          (root / f"watcher-release-manifest-{version}.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )

          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload certified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: certified-watcher-release-${{ env.VERSION }}
          if-no-files-found: error
          retention-days: 90
          path: |
            release/*

      - name: Owner publication handoff
        run: |
          echo "WATCHER_RELEASE_CERTIFIED version=$VERSION"
          echo "tag=v$VERSION"
          echo "runtime_source=$RUNTIME_SOURCE_SHA"
          echo "build_source=$BUILD_SOURCE_SHA"
          echo "windows_run=$WINDOWS_RUN_ID"
          echo "nonwindows_run=$NONWINDOWS_RUN_ID"
          echo "GitHub Actions release creation is intentionally not used because the repository integration is denied release-create permission."
          echo "An authenticated repository owner must publish the certified bundle against the pre-created v$VERSION tag, then verify the release inventory before advancing app metadata."
